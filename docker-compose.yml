version: '3.8'

services:
  youtube-subtitle:
    build: .
    container_name: youtube-subtitle
    restart: unless-stopped
    environment:
      - VIRTUAL_HOST=${VIRTUAL_HOST}
      - VIRTUAL_PORT=8000
      - YOUTUBE_PROXY_URL=${YOUTUBE_PROXY_URL}
      - YOUTUBE_COOKIES_FILE=${YOUTUBE_COOKIES_FILE}
    volumes:
      - ./cookies.txt:/app/cookies.txt
    networks:
      - nginx-proxy

networks:
  nginx-proxy:
    external: true
